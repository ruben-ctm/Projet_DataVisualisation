[project]
name = "stackoverflow-ia-2026"
version = "0.1.0"
description = "Application Streamlit d'analyse de l'enquête Stack Overflow 2026 : l'IA au travail chez les développeurs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.40",
    "pandas>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "nbformat>=5.10",
    "nbclient>=0.10",
    "ipykernel>=6.29",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
